<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/study-deck/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/study-deck/favicon-32.png" />
    <link rel="apple-touch-icon" href="/study-deck/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f9fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>生産管理プランニング3級 学習</title>
    <style>
      /* JSが読み込まれる前から即表示する起動ローダー（白基調・本のページめくり） */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f7f9fd;
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      #boot .bl-text {
        font-size: 14px;
        color: #7b869b;
        font-weight: 600;
        letter-spacing: 0.04em;
        animation: blink 1.3s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.28;
        }
      }
      /* 3D的な本のページめくり */
      .bookflip {
        perspective: 260px;
        width: 92px;
        height: 68px;
      }
      .bookflip .bk {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(24deg);
      }
      .bookflip .h,
      .bookflip .pg {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50%;
        box-sizing: border-box;
        border: 2px solid #2347c5;
      }
      .bookflip .h.l {
        left: 0;
        border-right: none;
        border-radius: 7px 0 0 7px;
        background: linear-gradient(90deg, #eef2fb, #fff);
      }
      .bookflip .h.r {
        right: 0;
        border-left: none;
        border-radius: 0 7px 7px 0;
        background: linear-gradient(90deg, #fff, #eef2fb);
      }
      .bookflip .pg {
        left: 50%;
        transform-origin: left center;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        border-left: none;
        border-radius: 0 7px 7px 0;
        background: linear-gradient(90deg, #fff, #dfe7f7);
        box-shadow: 2px 0 8px rgba(18, 38, 90, 0.18);
        animation: bkflip 1.6s infinite ease-in-out;
      }
      .bookflip .pg:nth-child(3) {
        animation-delay: 0.32s;
      }
      .bookflip .pg:nth-child(4) {
        animation-delay: 0.64s;
      }
      @keyframes bkflip {
        0% {
          transform: rotateY(0deg);
        }
        60%,
        100% {
          transform: rotateY(-179deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="bookflip">
          <div class="bk">
            <span class="h l"></span>
            <span class="h r"></span>
            <span class="pg"></span>
            <span class="pg"></span>
            <span class="pg"></span>
          </div>
        </div>
        <div class="bl-text">読み込み中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
