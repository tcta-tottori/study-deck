<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/study-deck/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/study-deck/favicon-32.png" />
    <link rel="apple-touch-icon" href="/study-deck/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f9fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>StudyDrill</title>
    <style>
      /* JSが読み込まれる前から即表示する起動ローダー（白基調・本の線画を描くアニメ）。
         #root の外に置き、アプリ準備完了までこの1枚だけを表示する（ローダー2回表示を防止）。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f7f9fd;
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .bl-text {
        font-size: 14px;
        color: #7b869b;
        font-weight: 600;
        letter-spacing: 0.08em;
        animation: blink 1.3s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      /* 本の線画（ページ＋その下に表紙のような線）を繰り返し描くローディング */
      .bookline {
        width: 104px;
        height: auto;
      }
      .bookline .pg {
        stroke: #2347c5;
        stroke-width: 3.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: bookdraw 2.2s ease-in-out infinite;
      }
      .bookline .pg2 {
        stroke-width: 3.2;
        opacity: 0.85;
        animation-delay: 0.26s;
      }
      @keyframes bookdraw {
        0% {
          stroke-dashoffset: 1;
        }
        48% {
          stroke-dashoffset: 0;
        }
        72% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <svg class="bookline" viewBox="0 0 120 92" fill="none" aria-hidden="true">
        <path
          class="pg pg1"
          pathLength="1"
          d="M32 18 Q30 11 40 11 L82 11 Q92 11 92 19 L94 47 Q95 55 82 55 L38 55 Q26 55 27 47 Z"
        />
        <path
          class="pg pg2"
          pathLength="1"
          d="M27 27 Q15 29 15 41 L17 64 Q17 75 31 75 L88 75 Q103 75 103 61 L101 40 Q101 30 90 29"
        />
      </svg>
      <div class="bl-text">Loading</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
