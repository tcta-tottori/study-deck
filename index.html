<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/study-deck/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/study-deck/favicon-32.png" />
    <link rel="apple-touch-icon" href="/study-deck/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f9fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>StudyDrill</title>
    <script>
      /* 起動ローダーを描く前に保存済みテーマを即適用（ダーク時のちらつき防止）。
         'sd-theme' は 'auto' | 'light' | 'dark'。未保存の既定はライト。 */
      (function () {
        try {
          var m = localStorage.getItem('sd-theme') || 'light'
          var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* localStorage 不可環境では CSS のメディアクエリにフォールバック */
        }
      })()
    </script>
    <style>
      /* JSが読み込まれる前から即表示する起動ローダー（白基調・本の線画を描くアニメ）。
         #root の外に置き、アプリ準備完了までこの1枚だけを表示する（ローダー2回表示を防止）。 */
      #boot {
        /* 読み込み画面のテーマ変数（既定＝ライト）。ダーク時は下部で上書き。 */
        --boot-bg: #f7f9fd;
        --boot-ink: #2347c5;
        --boot-page: #ffffff;
        --boot-page2: #e6ecf9;
        --boot-text: #7b869b;
        --boot-shadow: rgba(18, 38, 90, 0.16);
        --boot-stack-a: #9fb1ee;
        --boot-stack-b: #6f88e0;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--boot-bg);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        transition: opacity 0.4s ease;
      }
      /* システムがダーク かつ 明示的にライト指定されていないときはダーク配色 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #boot {
          --boot-bg: #0a1122;
          --boot-ink: #4d70f0;
          --boot-page: #17284b;
          --boot-page2: #0f1a30;
          --boot-text: #93a1bd;
          --boot-shadow: rgba(0, 0, 0, 0.5);
          --boot-stack-a: #2f4a9e;
          --boot-stack-b: #3f5fd0;
        }
      }
      /* アプリが明示的にダークを適用したとき（設定＝ダーク） */
      :root[data-theme='dark'] #boot {
        --boot-bg: #0a1122;
        --boot-ink: #4d70f0;
        --boot-page: #17284b;
        --boot-page2: #0f1a30;
        --boot-text: #93a1bd;
        --boot-shadow: rgba(0, 0, 0, 0.5);
        --boot-stack-a: #2f4a9e;
        --boot-stack-b: #3f5fd0;
      }
      #boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .bl-text {
        font-size: 14px;
        color: var(--boot-text);
        font-weight: 600;
        letter-spacing: 0.08em;
        animation: blink 1.3s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      /* 3Dの分厚い本：左右の厚いページ束の上を、ページが1枚ずつ最後までめくれるローディング */
      .book3d {
        perspective: 300px;
        width: 74px;
        height: 48px;
      }
      .book3d .bk {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(32deg);
      }
      .book3d .stack,
      .book3d .leaf {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50%;
        box-sizing: border-box;
      }
      /* 左右の分厚いページ束。下方向へ段積みして「厚み（3D）」を表現する */
      .book3d .stack {
        border: 2px solid var(--boot-ink);
        background: var(--boot-page);
        box-shadow:
          0 2px 0 -1px var(--boot-page), 0 3px 0 0 var(--boot-stack-a),
          0 4px 0 -1px var(--boot-page), 0 5px 0 0 var(--boot-stack-b),
          0 6px 0 -1px var(--boot-page), 0 7px 0 0 var(--boot-ink);
      }
      .book3d .stack.left {
        left: 0;
        border-right: none;
        border-radius: 7px 0 0 7px;
        background: linear-gradient(90deg, var(--boot-page2), var(--boot-page));
      }
      .book3d .stack.right {
        right: 0;
        border-left: none;
        border-radius: 0 7px 7px 0;
        background: linear-gradient(90deg, var(--boot-page), var(--boot-page2));
      }
      /* 1枚ずつめくれるページ（右→左へ0→-180度で最後までめくる）。両面あり */
      .book3d .leaf {
        right: 0;
        transform-origin: left center;
        transform-style: preserve-3d;
        /* 緩急のある動き（ゆっくり起き上がり→パタンと倒れる） */
        animation: leafflip 3.2s cubic-bezier(0.7, 0, 0.25, 1) infinite;
      }
      /* ページは両面とも全周に枠線・角丸。右で伏せても左へ着地しても端が切れない。 */
      .book3d .leaf b {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 2px solid var(--boot-ink);
        border-radius: 7px;
        backface-visibility: hidden;
      }
      .book3d .leaf .front {
        background: linear-gradient(90deg, var(--boot-page), var(--boot-page2));
        box-shadow: 1px 1px 5px var(--boot-shadow);
      }
      .book3d .leaf .back {
        background: linear-gradient(270deg, var(--boot-page), var(--boot-page2));
        transform: rotateY(180deg);
      }
      .book3d .leaf.l2 {
        animation-delay: 0.8s;
      }
      .book3d .leaf.l3 {
        animation-delay: 1.6s;
      }
      .book3d .leaf.l4 {
        animation-delay: 2.4s;
      }
      /* 前半1/4で最後まで（-180度）めくり切り、残りは左側で伏せる。4枚を順にめくる */
      @keyframes leafflip {
        0% {
          transform: rotateY(0deg);
        }
        25%,
        100% {
          transform: rotateY(-180deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="book3d" aria-hidden="true">
        <div class="bk">
          <span class="stack left"></span>
          <span class="stack right"></span>
          <span class="leaf l1"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l2"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l3"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l4"><b class="front"></b><b class="back"></b></span>
        </div>
      </div>
      <div class="bl-text">Loading</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
