<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/study-deck/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/study-deck/favicon-32.png" />
    <link rel="apple-touch-icon" href="/study-deck/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f9fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>StudyDrill</title>
    <style>
      /* JSが読み込まれる前から即表示する起動ローダー（白基調・本の線画を描くアニメ）。
         #root の外に置き、アプリ準備完了までこの1枚だけを表示する（ローダー2回表示を防止）。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f7f9fd;
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .bl-text {
        font-size: 14px;
        color: #7b869b;
        font-weight: 600;
        letter-spacing: 0.08em;
        animation: blink 1.3s infinite ease-in-out;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      /* 3Dの分厚い本：左右の厚いページ束の上を、ページが1枚ずつ最後までめくれるローディング */
      .book3d {
        perspective: 300px;
        width: 92px;
        height: 60px;
      }
      .book3d .bk {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(32deg);
      }
      .book3d .stack,
      .book3d .leaf {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50%;
        box-sizing: border-box;
      }
      /* 左右の分厚いページ束。下方向へ段積みして「厚み（3D）」を表現する */
      .book3d .stack {
        border: 2px solid #2347c5;
        background: #fff;
        box-shadow:
          0 2px 0 -1px #fff, 0 3px 0 0 #9fb1ee,
          0 4px 0 -1px #fff, 0 5px 0 0 #6f88e0,
          0 6px 0 -1px #fff, 0 7px 0 0 #2347c5;
      }
      .book3d .stack.left {
        left: 0;
        border-right: none;
        border-radius: 7px 0 0 7px;
        background: linear-gradient(90deg, #eef2fb, #fff);
      }
      .book3d .stack.right {
        right: 0;
        border-left: none;
        border-radius: 0 7px 7px 0;
        background: linear-gradient(90deg, #fff, #eef2fb);
      }
      /* 1枚ずつめくれるページ（右→左へ0→-180度で最後までめくる）。両面あり */
      .book3d .leaf {
        right: 0;
        transform-origin: left center;
        transform-style: preserve-3d;
        /* 緩急のある動き（ゆっくり起き上がり→パタンと倒れる） */
        animation: leafflip 3.2s cubic-bezier(0.7, 0, 0.25, 1) infinite;
      }
      .book3d .leaf b {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 2px solid #2347c5;
        border-left: none;
        border-radius: 0 7px 7px 0;
        backface-visibility: hidden;
      }
      .book3d .leaf .front {
        background: linear-gradient(90deg, #fff, #e6ecf9);
        box-shadow: 1px 1px 5px rgba(18, 38, 90, 0.16);
      }
      .book3d .leaf .back {
        background: linear-gradient(270deg, #fff, #e6ecf9);
        transform: rotateY(180deg);
      }
      .book3d .leaf.l2 {
        animation-delay: 0.8s;
      }
      .book3d .leaf.l3 {
        animation-delay: 1.6s;
      }
      .book3d .leaf.l4 {
        animation-delay: 2.4s;
      }
      /* 前半1/4で最後まで（-180度）めくり切り、残りは左側で伏せる。4枚を順にめくる */
      @keyframes leafflip {
        0% {
          transform: rotateY(0deg);
        }
        25%,
        100% {
          transform: rotateY(-180deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="book3d" aria-hidden="true">
        <div class="bk">
          <span class="stack left"></span>
          <span class="stack right"></span>
          <span class="leaf l1"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l2"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l3"><b class="front"></b><b class="back"></b></span>
          <span class="leaf l4"><b class="front"></b><b class="back"></b></span>
        </div>
      </div>
      <div class="bl-text">Loading</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
